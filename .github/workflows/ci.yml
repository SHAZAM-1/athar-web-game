name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Doctor config, typecheck, audit, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update npm to the supported current major
        run: |
          npm install --global npm@11 --no-audit --no-fund
          npm --version
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm install --no-audit --no-fund && exit 0
            echo "npm install failed (attempt $attempt/3); clearing cache before retry."
            npm cache clean --force
            sleep "$attempt"
          done
          exit 1
      - name: Project Doctor syntax and memory checks
        run: |
          node --check tools/project-doctor/doctor.mjs
          node --check tools/project-doctor/self-test.mjs
          node --check tools/project-doctor/apply-safe-fix.mjs
          npm run doctor:self-test
      - name: Security audit
        run: npm audit --audit-level=moderate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
