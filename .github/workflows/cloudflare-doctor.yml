name: Cloudflare Doctor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [dev/athar-full-project]
    paths:
      - "index.html"
      - "src/**"
      - "3d-prototype/**"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/cloudflare-doctor.yml"
      - "tools/cloudflare-doctor/**"
      - "tools/project-doctor/doctor.mjs"
      - "tools/project-doctor/knowledge.json"
      - "tools/project-doctor/safe-fixes.json"
      - "tools/project-doctor/self-test.mjs"

permissions:
  contents: write

# Serialize journal writers. Cancelling a run mid-persistence can leave competing
# commits racing to update the same incident-history JSON file.
concurrency:
  group: athar-cloudflare-doctor
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect Cloudflare Pages and hand findings to Project Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out Athar
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloudflare Doctor
        run: |
          node --check tools/cloudflare-doctor/cloudflare-doctor.mjs
          node --check tools/cloudflare-doctor/persist-incidents.mjs
          npm run cloudflare:doctor:self-test

      - name: Inspect Cloudflare Pages, deployment history, logs, and live assets
        id: cloudflare
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f1a193eb36bd54140a6234130403968e
          CLOUDFLARE_PAGES_PROJECT: athar-web-game
        run: npm run cloudflare:doctor

      - name: Persist incidents in the repository journal
        id: persist
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f cloudflare-doctor-report.json ]; then
            echo 'Cloudflare report is missing; incident journal was not updated.'
            exit 1
          fi
          BRANCH='dev/athar-full-project'
          JOURNAL='tools/project-doctor/cloudflare-incident-history.json'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Rebase the run's checkout onto the current dev tip BEFORE updating
          # the journal, so the merge starts from the newest persisted history.
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"

          npm run cloudflare:doctor:persist
          git add "$JOURNAL"
          if git diff --cached --quiet; then
            echo 'Incident history unchanged; no commit needed.'
            exit 0
          fi

          git commit -m 'chore: record Cloudflare Doctor incidents [skip ci]'

          # A human or another automation may push while this job is running.
          # Retry only fast-forward-safe rebases/pushes; never force-push or
          # discard the remote journal. Any real content conflict fails safely.
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if git push origin "HEAD:refs/heads/$BRANCH"; then
              echo "Incident history persisted successfully on $BRANCH (attempt $attempt)."
              exit 0
            fi
            echo "Push attempt $attempt lost a race; will refresh and retry."
            sleep "$attempt"
          done

          echo 'Unable to persist incident history after 3 safe push attempts.'
          exit 1

      - name: Pass Cloudflare evidence to Athar Project Doctor
        id: project_doctor
        continue-on-error: true
        run: |
          echo "Cloudflare Doctor handoff report: cloudflare-doctor-report.json"
          npm run doctor

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athar-cloudflare-doctor-${{ github.run_id }}
          path: |
            cloudflare-doctor-report.json
            cloudflare-doctor-summary.md
            project-doctor-report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Report diagnostic result
        if: always()
        env:
          CLOUDFLARE_OUTCOME: ${{ steps.cloudflare.outcome }}
          PROJECT_DOCTOR_OUTCOME: ${{ steps.project_doctor.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
        run: |
          echo "Cloudflare Doctor: $CLOUDFLARE_OUTCOME"
          echo "Incident persistence: $PERSIST_OUTCOME"
          echo "Project Doctor: $PROJECT_DOCTOR_OUTCOME"
          if [ "$CLOUDFLARE_OUTCOME" != "success" ] || [ "$PERSIST_OUTCOME" != "success" ] || [ "$PROJECT_DOCTOR_OUTCOME" != "success" ]; then
            echo "One or more diagnostic agents reported a failure. Download the artifact for the evidence and diagnosis."
            exit 1
          fi
