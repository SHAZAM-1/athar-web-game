name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update npm to the validated major
        run: |
          npm install --global npm@11 --no-audit --no-fund
          npm --version
      - name: Install dependencies
        # Keep bounded retries as a fallback; npm 11 avoids the repeated npm 10 edgesOut crash seen in CI.
        run: |
          for attempt in 1 2 3; do
            npm install --no-audit --no-fund && exit 0
            echo "npm install failed (attempt $attempt/3); clearing npm cache before retry."
            npm cache clean --force
            sleep "$attempt"
          done
          exit 1
      - name: Security audit
        run: npm audit --audit-level=moderate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      # Pages must first be enabled in repository Settings by an admin.
      # The workflow token cannot enable Pages when the repository integration lacks admin access.
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
